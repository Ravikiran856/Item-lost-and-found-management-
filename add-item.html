<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Item - Lost & Found</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <header>
        <nav>
            <h1>Lost & Found Management</h1>
        </nav>
    </header>
    <div class="logout-bar">
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    <main class="add-item-page">
        <div class="container">
            <div class="card">
                <h2>Add <span id="item-type">Item</span></h2>
                <form id="add-item-form">
                    <div class="form-group">
                        <label for="item-name">Item Name:</label>
                        <input type="text" id="item-name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="item-type-select">Item Type:</label>
                        <select id="item-type-select" name="type" required>
                            <option value="Electronics">Electronics</option>
                            <option value="Books">Books</option>
                            <option value="Clothing">Clothing</option>
                            <option value="Accessories">Accessories</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="item-description">Description:</label>
                        <textarea id="item-description" name="description" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="item-location" id="location-label">Location Lost/Found:</label>
                        <input type="text" id="item-location" name="location" required>
                        <button type="button" id="select-map-btn" class="btn secondary" style="margin-top: 10px;">Select on Map</button>
                    </div>
                    <div id="map-container" style="display: none;">
                        <div id="map" style="height: 300px;"></div>
                        <div style="margin-top: 10px;">
                            <button type="button" id="confirm-location-btn" class="btn">Confirm Location</button>
                            <button type="button" id="cancel-map-btn" class="btn secondary">Cancel</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="item-image">Upload Image:</label>
                        <input type="file" id="item-image" name="image" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label for="contact-info">Contact Info (Email/Phone):</label>
                        <input type="text" id="contact-info" name="contact" required>
                    </div>
                    <button type="submit" class="btn">Add Item</button>
                    <button type="button" class="btn secondary" onclick="location.href='dashboard.html'">Cancel</button>
                </form>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; 2023 Lost & Found Management. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
